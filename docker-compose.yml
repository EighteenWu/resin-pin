services:
  resin-pin:
    build: .
    container_name: resin-pin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RESIN_URL: http://resin:2260
      PIN_STATE_PATH: /data/state.json
      PIN_LISTEN: 0.0.0.0:2270
    ports:
      - "2270:2270"
    volumes:
      - ./data:/data
    networks:
      - resin_net

networks:
  resin_net:
    name: resin_default
    external: true
